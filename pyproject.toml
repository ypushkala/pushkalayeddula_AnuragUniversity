[project]
name = "prativimb"
version = "1.1.0"
description = "Hybrid patient digital twin for glucose spike and cardiovascular risk forecasting (synthetic data)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "duckdb>=1.0",
    "pyarrow>=15",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "reportlab>=4.1",
    "joblib>=1.3",
    "simglucose==0.2.11",
    "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
docs = ["python-pptx>=0.6.23", "playwright>=1.44"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prativimb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
